[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subs"
version = "0.1.0"
description = "CLI за вграждане на анимирани субтитри във вертикално видео"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "Pillow>=10.0",
    "fonttools>=4.40",
]

[project.optional-dependencies]
# Транскрипцията тегли torch и е тежка — затова е отделно.
#
# whisperx декларира requires_python <3.14. Без ограничението тук pip
# връща назад до древна версия с ковък пин на ctranslate2 и цялата
# инсталация гърми. С него на Python 3.14 се инсталира само
# faster-whisper: инструментът работи, но без forced alignment и го казва.
transcribe = [
    "faster-whisper>=1.0",
    "whisperx>=3.8; python_version < '3.14'",
]
# Избор на подчертана дума през езиков модел (v2, зад флаг).
llm = ["anthropic>=0.40"]
dev = ["pytest>=7.4"]

[project.scripts]
subs = "subs.cli:main"

[project.gui-scripts]
# gui-scripts вместо scripts: на Windows тръгва през pythonw.exe и зад
# прозореца не увисва черна конзола.
subs-gui = "subs.gui:main"

[tool.setuptools.packages.find]
include = ["subs*"]

[tool.setuptools.package-data]
subs = ["assets/fonts/*.ttf", "assets/fonts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
